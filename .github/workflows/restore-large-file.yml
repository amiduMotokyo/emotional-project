name: Restore large time-aligned artifact

on:
  push:
    paths:
      - A/validation/text_time/time_aligned/final_features_time_aligned.pkl.gz
      - .github/workflows/restore-large-file.yml

permissions:
  contents: write

concurrency:
  group: restore-large-file
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the original pickle and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc A/validation/text_time/time_aligned/final_features_time_aligned.pkl.gz > A/validation/text_time/time_aligned/final_features_time_aligned.pkl
          rm A/validation/text_time/time_aligned/final_features_time_aligned.pkl.gz
          rm .github/workflows/restore-large-file.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore full time-aligned feature artifact"
          git push
